services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ocr_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocr_pipeline"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:local@db:5432/ocr_pipeline
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  data:
